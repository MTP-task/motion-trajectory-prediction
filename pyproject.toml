[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mtp"
version = "0.0.1"
description = "Predicting upper-limb motion trajectories from EEG and IMU during motor execution (ME) and motor imagery (MI)."
authors = [
  { name = "Nantawat Sukrisunt" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["mtp"]
include = ["pyproject.toml", "mtp/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mtp"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]

